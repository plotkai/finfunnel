<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Funnel Stream Background Waves -->
  <path d="M 120 140 C 220 140, 200 240, 256 240 C 312 240, 292 140, 392 140" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="24" stroke-linecap="round" />
  <path d="M 120 372 C 220 372, 200 272, 256 272 C 312 272, 292 372, 392 372" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="24" stroke-linecap="round" />

  <!-- Center Funnel / Node -->
  <g filter="url(#shadow)">
    <!-- Funnel shape -->
    <path d="M 140 160 L 372 160 L 296 270 L 296 350 L 216 350 L 216 270 Z" fill="url(#glow)" opacity="0.9" />
    
    <!-- Currency / Balance Symbol Center -->
    <circle cx="256" cy="220" r="32" fill="#0f172a" />
    <path d="M 244 204 H 268 M 244 214 H 268 M 244 204 H 258 C 265 204, 265 224, 256 224 H 244 L 268 238" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Inflow Top Dot -->
  <circle cx="256" cy="110" r="14" fill="#10b981" />
  <!-- Outflow Bottom Dot -->
  <circle cx="256" cy="402" r="14" fill="#f43f5e" />
  <path d="M 256 124 L 256 148" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 4" />
  <path d="M 256 364 L 256 388" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 4" />
</svg>
